[project]
name = "ai-modal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "murhee-ia", email = "mcrispasague@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ai-modal = "ai_modal:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["."]
pythonVersion = "3.12"
typeCheckingMode = "basic"
