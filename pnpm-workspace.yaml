packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Catalogs: pin one version of a shared dependency here, and every
# package.json below references it with "catalog:" instead of a literal
# version — so bumping React/TypeScript/ESLint everywhere is a one-line change.
allowBuilds:
  unrs-resolver: false

catalog:
  typescript: ^5.7.0
  eslint: ^9.17.0
  "@eslint/js": ^9.17.0
  prettier: ^3.4.0
  typescript-eslint: ^8.70.0
  eslint-plugin-turbo: ^2.10.12
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.12.0
  next: 16.3.5
  react: 19.2.8
  react-dom: 19.2.8
  "@supabase/supabase-js": ^2.116.0
  "@supabase/ssr": ^0.12.7
  lucide-react: ^0.469.0
  zod: ^4.6.5
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-table": ^9.2.4
